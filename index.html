    :root {
      --bg-dark: #0d0a10;
      --bg-card: rgba(26, 20, 32, 0.65);
      --rose-gold: #e8b4b8;
      --rose-accent: #f4c2c2;
      --gold-bright: #ffd700;
      --purple-accent: #d4a5ec;
      --pink-glow: rgba(232, 180, 184, 0.4);
      --text-main: #fcf8f9;
      --text-muted: #b8afb9;
      --glass-border: rgba(232, 180, 184, 0.18);
      --gradient-luxury: linear-gradient(135deg, #e8b4b8 0%, #d4a5ec 50%, #f4c2c2 100%);
      --gradient-gold: linear-gradient(135deg, #f7d08a 0%, #e8b4b8 100%);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
      --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(212, 165, 236, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(232, 180, 184, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--rose-gold);
      border-radius: 4px;
    }

    /* Header & Navigation */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(13, 10, 16, 0.75);
      border-bottom: 1px solid var(--glass-border);
      transition: var(--transition-smooth);
    }

    .nav-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
    }

    .logo-svg {
      width: 55px;
      height: 55px;

    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-title {
      font-size: 1.6rem;
      font-weight: 900;
      background: var(--gradient-luxury);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .logo-subtitle {
      font-size: 0.75rem;
      color: var(--rose-accent);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      gap: 30px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 1.05rem;
      transition: var(--transition-smooth);
      position: relative;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--rose-gold);
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -6px;
      right: 0;
      width: 0;
      height: 2px;
      background: var(--gradient-luxury);
      transition: var(--transition-smooth);
      border-radius: 2px;
    }

    .nav-links a:hover::after, .nav-links a.active::after {
      width: 100%;
    }
